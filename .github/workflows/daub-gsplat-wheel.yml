# Daub: build one gsplat wheel for Windows that runs on RTX 30, 40 and 50 series cards.
#
# Goes in your GitHub copy of gsplat at:  .github/workflows/daub-gsplat-wheel.yml
# Run it from the repo's Actions tab ("Daub gsplat wheel" -> Run workflow). A full build takes a few hours.
# Tick "Quick check" to compile for RTX 50 only, which finds compile errors several times faster.
# The finished wheel appears under the run's "Artifacts" as daub-gsplat-wheel.zip.
#
# Based on gsplat's own Windows build (.github/workflows/building.yml), with four changes:
#   - only the one combination Daub uses: Windows, Python 3.10, PyTorch 2.10.0, CUDA 12.8
#   - GPU list: RTX 30/40 (8.6), RTX 50 (12.0)
#   - extra overflow memory (pagefile) and capped parallel compiles, so big files can't run out of memory
#   - always builds the same, tested gsplat code (a fixed commit), not whatever is newest
#   - small fixes for Windows-only compile errors in that commit (see "Patch" step)

name: Daub gsplat wheel

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick check: compile for RTX 50 only, to find compile errors fast (not for release)"
        type: boolean
        default: false

# The build only needs to read the code; it can't change anything else in the repo.
permissions:
  contents: read

jobs:
  windows-wheel:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      GSPLAT_COMMIT: 512d366b67073d77ca099ede742683c165dfc23b
      TORCH_VERSION: "2.10.0"
      CUDA_TAG: cu128
      CUDA_HOME: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
      # RTX 30 and RTX 40 = 8.6 (RTX 40 runs 8.6 code natively), RTX 50 = 12.0. RTX 20 (7.5) dropped to
      # keep the build well inside GitHub's time limit; add 7.5 back to support RTX 20 cards.
      # No +PTX (portable code for future cards): a whole extra compile per file, and a future card
      # generation would need a new build anyway.
      TORCH_CUDA_ARCH_LIST: ${{ inputs.quick && '12.0' || '8.6;12.0' }}
      # At most 4 compiler processes at once (2 files x 2 GPU generations each). The machine has 4 cores
      # and 16 GB; 3 x 3 = 9 at once ran out of memory on the biggest files.
      MAX_JOBS: "2"
      NVCC_APPEND_FLAGS: "--threads 2"

    steps:
      - name: Add overflow memory (pagefile) so big files can't run out of memory
        # al-cheb/configure-pagefile-action (MIT), locked to one reviewed version. Runs only on this
        # throwaway build machine; nothing from it ends up in the wheel.
        uses: al-cheb/configure-pagefile-action@b158448acc98bbaeed7513afc5c84229405b33ad
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Get gsplat at the fixed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GSPLAT_COMMIT }}
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CUDA 12.8 (build tools only)
        run: bash .github/workflows/cuda/Windows.sh ${{ env.CUDA_TAG }}
        shell: bash

      - name: Reuse downloaded packages from earlier runs
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ env.TORCH_VERSION }}-${{ env.CUDA_TAG }}-v1

      - name: Install PyTorch ${{ env.TORCH_VERSION }}+${{ env.CUDA_TAG }}
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<82" wheel ninja numpy
          pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/${{ env.CUDA_TAG }}
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
        shell: bash

      - name: Keep compiling after errors (report every broken file in one run)
        # PyTorch's build helper runs "ninja -v"; adding "-k 0" makes ninja finish every file it can.
        run: |
          import pathlib, torch.utils.cpp_extension as ce
          p = pathlib.Path(ce.__file__)
          s = p.read_text(encoding="utf-8")
          old = "command = ['ninja', '-v']"
          if old in s:
              p.write_text(s.replace(old, "command = ['ninja', '-v', '-k', '0']"), encoding="utf-8")
              print("keep-going on")
          else:
              print("::warning::could not enable keep-going; the build stops at the first error")
        shell: python

      - name: Patch Windows-only compile errors
        # gsplat is only tested on Linux; Windows (MSVC) rejects five spots in this commit.
        # 1. Cameras.cuh calls std::isfinite in GPU code; MSVC's isfinite is CPU-only. Same test in plain
        #    arithmetic: |x| <= FLT_MAX is false exactly when x is infinite or NaN.
        # 2. SphericalHarmonicsL1PlusCUDA.cu makes a size-0 std::array when the SH degree is 0; MSVC's
        #    size-0 array has a CPU-only operator[]. Give it at least 1 slot (never read; loops stop at MAX_K).
        # 3. RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu uses __builtin_clzll (GCC/Clang only) in CPU code.
        #    Replace with a plain loop that counts the bits of x-1, which is the same number.
        # 4. Link: at::cuda::cub::radix_sort_pairs isn't exported from PyTorch's Windows DLL. Call CUB's
        #    DeviceRadixSort::SortPairs directly instead (same sort, same stream), as IntersectTile.cu does.
        # 5. Link: the ParallelBatch fwd launcher is declared with "bool fwd_only" but defined with
        #    "const bool fwd_only"; MSVC gives those different names. Make the definition match.
        run: |
          import pathlib, sys
          patches = [
              ("gsplat/cuda/include/Cameras.cuh",
               "std::isfinite(point.x)", "(fabsf(point.x) <= 3.402823466e+38f)", 1),
              ("gsplat/cuda/include/Cameras.cuh",
               "std::isfinite(point.y)", "(fabsf(point.y) <= 3.402823466e+38f)", 1),
              ("gsplat/cuda/csrc/SphericalHarmonicsL1PlusCUDA.cu",
               "std::array<opmath_t, MAX_K> acc{};", "std::array<opmath_t, (MAX_K > 0 ? MAX_K : 1)> acc{};", 1),
              ("gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu",
               "return 64u - static_cast<uint32_t>(__builtin_clzll(x - 1));",
               "uint64_t v = x - 1; uint32_t bits = 0; while(v) { ++bits; v >>= 1; } return bits;", 1),
              ('gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu',
               '#    include <ATen/cuda/cub.h>\n',
               '#    include <ATen/cuda/cub.h>\n#    include <c10/cuda/CUDACachingAllocator.h>\n#    include <cub/cub.cuh>\n', 1),
              ('gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu',
               '    at::cuda::cub::radix_sort_pairs<int64_t, int32_t>(\n        sort_keys.const_data_ptr<int64_t>(),\n        sorted_keys.data_ptr<int64_t>(),\n        sort_values.const_data_ptr<int32_t>(),\n        bid_to_slot.data_ptr<int32_t>(),\n        total_batches,\n        /*descending=*/false,\n        /*begin_bit=*/0,\n        /*end_bit=*/static_cast<int64_t>(total_bits == 0 ? 1u : total_bits)\n    );',
               '    CUB_WRAPPER(\n        cub::DeviceRadixSort::SortPairs,\n        sort_keys.const_data_ptr<int64_t>(),\n        sorted_keys.data_ptr<int64_t>(),\n        sort_values.const_data_ptr<int32_t>(),\n        bid_to_slot.data_ptr<int32_t>(),\n        static_cast<int>(total_batches),\n        0,\n        static_cast<int>(total_bits == 0 ? 1u : total_bits),\n        at::cuda::getCurrentCUDAStream()\n    );', 1),
              ('gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchFwd.cu',
               '    const bool fwd_only,',
               '    bool fwd_only,', 1),
          ]
          ok = True
          for path, old, new, want in patches:
              f = pathlib.Path(path)
              s = f.read_text(encoding="utf-8")
              n = s.count(old)
              f.write_text(s.replace(old, new), encoding="utf-8")
              print(f"{path}: replaced {n} (expected {want})")
              if n != want:
                  print(f"::error::patch did not match in {path}: {old}")
                  ok = False
          if "std::isfinite" in pathlib.Path("gsplat/cuda/include/Cameras.cuh").read_text(encoding="utf-8"):
              print("::error::std::isfinite still present in Cameras.cuh")
              ok = False
          sys.exit(0 if ok else 1)
        shell: python

      - name: Label the version (1.6.0+pt210cu128)
        run: |
          VERSION=`sed -n 's/^__version__ = "\(.*\)"/\1/p' gsplat/version.py`
          sed -i "s/$VERSION/$VERSION+pt210cu128/" gsplat/version.py
          cat gsplat/version.py | tail -1
        shell: bash

      - name: Build the wheel
        run: |
          set -o pipefail
          export PATH="${CUDA_HOME}/bin:${PATH}"
          if ! python setup.py bdist_wheel --dist-dir=dist 2>&1 | tee build.log; then
            # Put the compiler's error lines in the run summary, so they can be read without the full log.
            grep -E " error[: ]|error:|fatal error" build.log | grep -v Werror | head -20 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi
        shell: bash

      - name: Check it installs and imports
        run: |
          pip install dist/*.whl
          python -c "import gsplat; print('gsplat', gsplat.__version__)"
          cd dist && certutil -hashfile *.whl SHA256
        shell: bash

      - name: Save the wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.quick && 'quick-check-only-not-for-release' || 'daub-gsplat-wheel' }}
          path: dist/*.whl
          retention-days: 30

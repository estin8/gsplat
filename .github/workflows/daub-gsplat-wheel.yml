# Daub: build one gsplat wheel for Windows that runs on RTX 20, 30, 40 and 50 series cards.
#
# Goes in your GitHub copy of gsplat at:  .github/workflows/daub-gsplat-wheel.yml
# Run it from the repo's Actions tab ("Daub gsplat wheel" -> Run workflow). It takes about 1-2 hours.
# Tick "Quick check" to compile for RTX 50 only, which finds compile errors several times faster.
# The finished wheel appears under the run's "Artifacts" as daub-gsplat-wheel.zip.
#
# Based on gsplat's own Windows build (.github/workflows/building.yml), with four changes:
#   - only the one combination Daub uses: Windows, Python 3.10, PyTorch 2.10.0, CUDA 12.8
#   - GPU list extended to RTX 40 (8.9) and RTX 50 (12.0), plus portable code for future cards (+PTX)
#   - always builds the same, tested gsplat code (a fixed commit), not whatever is newest
#   - one-line fix for a Windows-only compile error in that commit (see "Patch" step)

name: Daub gsplat wheel

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick check: compile for RTX 50 only, to find compile errors fast (not for release)"
        type: boolean
        default: false

jobs:
  windows-wheel:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      GSPLAT_COMMIT: 512d366b67073d77ca099ede742683c165dfc23b
      TORCH_VERSION: "2.10.0"
      CUDA_TAG: cu128
      CUDA_HOME: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
      # RTX 20 = 7.5, RTX 30 = 8.0/8.6, RTX 40 = 8.9, RTX 50 = 12.0
      TORCH_CUDA_ARCH_LIST: ${{ inputs.quick && '12.0' || '7.5;8.0;8.6;8.9;12.0+PTX' }}
      MAX_JOBS: "4"

    steps:
      - name: Get gsplat at the fixed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GSPLAT_COMMIT }}
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CUDA 12.8 (build tools only)
        run: bash .github/workflows/cuda/Windows.sh ${{ env.CUDA_TAG }}
        shell: bash

      - name: Reuse downloaded packages from earlier runs
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ env.TORCH_VERSION }}-${{ env.CUDA_TAG }}-v1

      - name: Install PyTorch ${{ env.TORCH_VERSION }}+${{ env.CUDA_TAG }}
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<82" wheel ninja numpy
          pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/${{ env.CUDA_TAG }}
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          # Keep compiling after a file fails, so one run reports every broken file instead of only the first.
          ce=$(python -c "import torch.utils.cpp_extension as c; print(c.__file__)")
          sed -i "s/command = \['ninja', '-v'\]/command = ['ninja', '-v', '-k', '0']/" "$ce"
          grep -q "'-k', '0'" "$ce" && echo "keep-going on" || echo "::warning::could not enable keep-going; build stops at the first error"
        shell: bash

      - name: Patch a Windows-only compile error
        # Cameras.cuh calls std::isfinite in GPU code. Linux compilers accept that; Windows' (MSVC) doesn't,
        # because its isfinite is a CPU-only template. Replace it with the same test in plain arithmetic:
        # |x| <= FLT_MAX is false exactly when x is infinite or NaN.
        run: |
          import pathlib, sys
          f = pathlib.Path("gsplat/cuda/include/Cameras.cuh")
          s = f.read_text(encoding="utf-8")
          n = 0
          for v in ("point.x", "point.y"):
              old, new = f"std::isfinite({v})", f"(fabsf({v}) <= 3.402823466e+38f)"
              n += s.count(old)
              s = s.replace(old, new)
          f.write_text(s, encoding="utf-8")
          print(f"replaced {n} call(s)")
          # Check only gsplat's own camera code. (A bundled math library, third_party/glm, also uses
          # std::isfinite, but only in CPU code, which compiles fine on Windows.)
          left = [f"{f}:{i}: {l.strip()}" for i, l in enumerate(s.splitlines(), 1) if "std::isfinite" in l]
          for l in left:
              print(f"::error::still present: {l[:300]}")
          if n != 2 or left:
              print(f"::error::patch expected 2 replacements, made {n}")
              sys.exit(1)
        shell: python

      - name: Label the version (1.6.0+pt210cu128)
        run: |
          VERSION=`sed -n 's/^__version__ = "\(.*\)"/\1/p' gsplat/version.py`
          sed -i "s/$VERSION/$VERSION+pt210cu128/" gsplat/version.py
          cat gsplat/version.py | tail -1
        shell: bash

      - name: Build the wheel
        run: |
          set -o pipefail
          export PATH="${CUDA_HOME}/bin:${PATH}"
          if ! python setup.py bdist_wheel --dist-dir=dist 2>&1 | tee build.log; then
            # Put the compiler's error lines in the run summary, so they can be read without the full log.
            grep -E " error[: ]|error:|fatal error" build.log | grep -v Werror | head -20 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi
        shell: bash

      - name: Check it installs and imports
        run: |
          pip install dist/*.whl
          python -c "import gsplat; print('gsplat', gsplat.__version__)"
          cd dist && certutil -hashfile *.whl SHA256
        shell: bash

      - name: Save the wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.quick && 'quick-check-only-not-for-release' || 'daub-gsplat-wheel' }}
          path: dist/*.whl
          retention-days: 30
